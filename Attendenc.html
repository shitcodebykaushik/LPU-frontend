<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Student Attendance & Performance</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 20px; }
		form { max-width: 400px; padding: 16px; border: 1px solid #ccc; border-radius: 4px; }
		label { display: block; margin-top: 10px; }
		input[type="text"], input[type="number"] { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
		button { margin-top: 15px; padding: 8px 16px; }
	</style>
	</head>
<body>
	<h2>Enter Student Details</h2>
	<form action="04.php" method="post">
		<label for="student_name">Student Name:</label>
		<input type="text" id="student_name" name="student_name" required>

		<label for="attendance">Attendance (%):</label>
		<input type="number" id="attendance" name="attendance" min="0" max="100" required>

		<label for="internal_marks">Internal Marks:</label>
		<input type="number" id="internal_marks" name="internal_marks" min="0" max="100" required>

		<button type="submit">Check Status</button>
	</form>
</body>
</html>
